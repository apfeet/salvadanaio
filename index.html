<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Salvadanaio</title>
<style>
  :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --btn-bg: #1d1d1f; --btn-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #8e8e93; --btn-bg: #f5f5f7; --btn-fg: #000; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 0 24px; text-align: center; box-sizing: border-box; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  h1 { font-weight: 200; font-size: 34px; margin: 0; }
  p { color: var(--muted); margin: 0; max-width: 320px; line-height: 1.4; }
  a.btn { margin-top: 10px; padding: 13px 26px; border-radius: 999px; background: var(--btn-bg); color: var(--btn-fg);
    text-decoration: none; font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #8ccda8; display: inline-block; margin-right: 6px;
    animation: pulse 1.6s ease-out infinite; vertical-align: middle; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(140,205,168,.6); } 100% { box-shadow: 0 0 0 8px rgba(140,205,168,0); } }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Salvadanaio</div>
  <h1 id="title">Torno all'app…</h1>
  <p id="text"><span class="dot"></span>Se non si apre da sola, tocca il pulsante qui sotto.</p>
  <a class="btn" id="open" href="salvadanaio://revolut">Apri Salvadanaio</a>
</main>
<script>
  // Pagina di ritorno di Enable Banking: passa code/state (o l'errore) all'app e basta.
  // Nessun dato viene salvato o inviato altrove.
  var q = location.search;
  if (q.indexOf("code=") === -1 && q.indexOf("error=") === -1) {
    document.getElementById("title").textContent = "Salvadanaio";
    document.getElementById("text").textContent = "Pagina di ritorno per l'app personale Salvadanaio dopo l'autorizzazione della banca.";
    document.getElementById("open").style.display = "none";
  } else {
    var target = "salvadanaio://revolut" + q;
    document.getElementById("open").href = target;
    location.replace(target);
  }
</script>
</body>
</html>
